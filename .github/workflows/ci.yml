name: CI

# Running superseded push builds wastes Windows runners and delays the
# newest production-security acceptance result. Manual runs are isolated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sunday midnight
  workflow_dispatch:

jobs:
  powershell-validation:
    name: PowerShell validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse all PowerShell files
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $errors++
              Write-Host "PARSE FAIL: $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message) @ line $($_.Extent.StartLineNumber)" }
            }
          }
          if ($errors -gt 0) { throw "$errors file(s) failed to parse" }
          Write-Host "All PowerShell files parse cleanly."

      - name: Validate JSON config
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.json' |
            Where-Object {
              $_.FullName -notmatch '[/\\](node_modules|\.git)[/\\]'
            }

          foreach ($file in $files) {
            try {
              $null = Get-Content -LiteralPath $file.FullName -Raw |
                ConvertFrom-Json -AsHashtable -ErrorAction Stop

              Write-Host "JSON OK: $($file.FullName)"
            }
            catch {
              throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
            }
          }

      - name: Run Phase 1 regression suite
        run: pwsh -NoProfile -File ./Scripts/Tests/Phase1-Regression.Tests.ps1

      - name: Test Windows prerequisite dry-run never changes execution policy
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-PrereqsVerifyOnly.ps1

      - name: Local Windows read-only diagnostic adapters (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-LocalWindowsDiagnostics.ps1
      - name: Local Windows read-only diagnostic adapters (PowerShell 5.1)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-LocalWindowsDiagnostics.ps1
      - name: Read-only LAN Windows host preflight (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-LanWindowsHostPreflight.ps1
      - name: Read-only LAN Windows host preflight (Windows PowerShell 5.1)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-LanWindowsHostPreflight.ps1

      - name: Retired legacy Windows SYSTEM installer must fail closed
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-LegacyAgentInstallerDisabled.ps1

      - name: Test generic MSI HTTPS setup and server reconfiguration
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-ConfigureAgent.ps1
      # N74: installed GUI uses native Windows PowerShell 5.1.
      - name: N74 native Windows PowerShell 5.1 first-run credential ACL regression
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-ConfigureAgent.ps1
      - name: Test per-device signed command verification in installed worker
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-CommandVerification.ps1
      - name: Test signed command verification in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-CommandVerification.ps1
      - name: Legacy standalone telemetry-only, remote execution disabled
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-LegacyAgentTelemetryOnly.ps1
      - name: Test signed UUID command lifecycle and result contract
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-CommandUuidLifecycle.ps1
      - name: Real SQLite UUID ledger concurrency and crash boundary
        run: python ./Enterprise/tests/test_command_uuid_sqlite.py
      - name: Reboot commands require approval, never auto-execute
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-RebootDefaultDeny.ps1
      - name: Legacy privileged task retirement (mocked exact task boundary)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-LegacyElevatedTaskRetirement.ps1
      - name: Legacy privileged task retirement on Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-LegacyElevatedTaskRetirement.ps1
      - name: MSI self-updater must refuse unsigned installation
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-SelfUpdateDefaultDeny.ps1
      - name: Test one-use enrollment bootstrap token is cleared after provisioning
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-EnrollmentBootstrapCleanup.ps1
      - name: Enrollment credential validation in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-EnrollmentBootstrapCleanup.ps1

      - name: Exercise canonical agent idle telemetry and durable ACK handling (N27)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-CanonicalAgent-AckCadence.ps1
      - name: Durable telemetry ACK cadence in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./Enterprise/tests/Test-CanonicalAgent-AckCadence.ps1

      - name: Verify unsigned MSI publication fails closed and invalid certificates are rejected
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-ReleaseSigningGates.ps1

      - name: N31 customer Windows preflight fails closed without configuration or consent
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage31WindowsPreflight.ps1

      - name: N38 refuse unpinned Windows live network probe, preserve offline redacted evidence
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage38WindowsNetworkProbe.ps1

      - name: N39 Windows public DNS policy rejects private/mixed addresses offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage39WindowsPublicAddressPolicy.ps1

      - name: N40 Windows HTTPS endpoint admission rejects unsafe origins offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage40WindowsEndpointPreflight.ps1

      - name: N41 Windows health response rejects ambiguous and degraded JSON offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage41WindowsHealthJson.ps1

      - name: N41 verify compatibility with actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage41WindowsHealthJson.ps1

      - name: N42 offline pinned HTTPS plan, consent and immutable report regression (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage42WindowsPinnedHttps.ps1

      - name: N42 verify offline pinned HTTPS plan on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage42WindowsPinnedHttps.ps1

      - name: N43 synthetic TLS/redirect/timeout/size fault injection and hostname-bound consent (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage43WindowsPinnedHttpsFaults.ps1

      - name: N43 synthetic TLS/redirect/timeout/size fault injection on real Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage43WindowsPinnedHttpsFaults.ps1

      - name: N45 Windows private health workspace and TEMP isolation (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage45WindowsPrivateProbeWorkspace.ps1

      - name: N45 verify private workspace ACLs on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage45WindowsPrivateProbeWorkspace.ps1

      - name: N46 atomic Windows ACL at directory creation and response-file access (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage46AtomicWindowsProbeAcl.ps1

      - name: N46 verify .NET Framework atomic directory ACL on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage46AtomicWindowsProbeAcl.ps1

      - name: N47 verify private HTTPS response cleanup and locked-file refusal (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage47WindowsProbeCleanup.ps1

      - name: N47 verify fail-closed private HTTPS cleanup on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage47WindowsProbeCleanup.ps1

      - name: N48 verify Microsoft-signed system curl Schannel provenance on Windows PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage48WindowsSystemCurlTrust.ps1

      - name: N48 verify signed system curl and TLS backend on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage48WindowsSystemCurlTrust.ps1

      - name: N49 Windows signer certificate SHA-256 approval pin and mismatch regression on PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage49WindowsCurlSignerPin.ps1

      - name: N49 verify per-invocation signer approval pin on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage49WindowsCurlSignerPin.ps1

      - name: N50 verify approved curl executable SHA-256 and tampering faults on Windows PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage50WindowsCurlBinaryPin.ps1

      - name: N50 verify Windows curl binary pin on actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage50WindowsCurlBinaryPin.ps1

      - name: N51 verify offline RSA reviewer-signed origin/curl approval and expiry on PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage51WindowsCurlSignedApproval.ps1

      - name: N51 verify offline reviewer-signed approval faults on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage51WindowsCurlSignedApproval.ps1

      - name: N52 ensure signed approval is revalidated before DNS, HTTPS and PASS (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage52WindowsApprovalRecheck.ps1

      - name: N52 verify signed approval rotation and expiry faults on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage52WindowsApprovalRecheck.ps1

      - name: N53 bind all signed-approval gates to one canonical record (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage53WindowsApprovalContinuity.ps1

      - name: N53 reject validly signed mid-run approval rotation (Windows PowerShell 5.1)
        shell: powershell
        run: ./Enterprise/tests/Test-Stage53WindowsApprovalContinuity.ps1

      - name: N54 test independent release SQLite ZIP and EXE hash pins (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage54SqliteBundleApproval.ps1

      - name: N54 reject tampered SQLite bytes and malformed pins on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage54SqliteBundleApproval.ps1

      - name: N55 verify canonical signed release manifest and upload gate on PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage55SignedArtifactPublication.ps1

      - name: N55 reject post-signing release mutation on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage55SignedArtifactPublication.ps1

      - name: N56 reviewer-signed release scope and original approval continuity (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage56ReviewedReleaseApproval.ps1

      - name: N56 reject different valid release record and pins on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage56ReviewedReleaseApproval.ps1

      - name: N58 verify same independently signed source approval at GitHub Release (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage58ReleasePublicationApproval.ps1

      - name: N58 reject release approval rotation and altered bytes on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage58ReleasePublicationApproval.ps1

      - name: N59 attest hosted draft and published GitHub asset SHA digests (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage59DraftReleaseAttestation.ps1

      - name: N59 reject wrong public release assets and SHA on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage59DraftReleaseAttestation.ps1

      - name: N60 verify untagged private draft and published commit ref (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage60DraftTagLifecycle.ps1

      - name: N60 reject mismatched tag source and draft release identity on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage60DraftTagLifecycle.ps1

      - name: N61 invoke actual protected release bridge with mock GitHub API (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage61RemoteReleaseBridge.ps1

      - name: N61 reject remote draft, Git ref and immutable ID faults on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage61RemoteReleaseBridge.ps1

      - name: N62 verify exact approved compiler and MSI toolchain pins (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage62BuildToolchainLock.ps1

      - name: N62 reject unpinned compiler versions under Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage62BuildToolchainLock.ps1

      - name: N63 verify independently approved compiler archive SHA and offline install gates (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage63ApprovedCompilerPackages.ps1

      - name: N63 reject tampered toolchain packages and automatic signing on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage63ApprovedCompilerPackages.ps1


      - name: N64 verify full reviewed PS2EXE module copy and precompile SHA continuity (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage64CompilerTreeContinuity.ps1

      - name: N64 reject mutated executable/compiler companion files on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage64CompilerTreeContinuity.ps1

      - name: N65 reject malicious approved-package ZIP entries on Windows PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage65CompilerArchiveSafety.ps1

      - name: N65 archive traversal, reparse and ZIP-bomb regression on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage65CompilerArchiveSafety.ps1

      - name: N66 verify protected WiX shim and tool-store continuity on Windows PowerShell 7
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage66WixToolContinuity.ps1

      - name: N66 reject malicious WiX tool PATH and installed-file substitutions on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage66WixToolContinuity.ps1

      - name: N67 reject provisioned/ambiguous signed-release config JSON (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage67ReleaseConfigAdmission.ps1

      - name: N31 release publication requires independently approved source and MSI pins
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage31PublicationPins.ps1

      - name: N32 redacted replay evidence and consent/immutability regression
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage32CustomerEvidence.ps1

      - name: N34/N35 operator Ed25519, registry revocation/rotation and signed customer evidence bundle (CI-only keys)
        run: node ./test-stage34-operator-signature.mjs

      - name: Run Pester suites (RemoteToolkit, BatchLauncher, Phase2 modules)
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 6 })) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester
          $all = @(
            (Invoke-Pester -Path ./Scripts/Tests/RemoteToolkit.tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/BatchLauncher.Tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/Phase2-Modules.Tests.ps1 -Output Normal -PassThru)
          )
          $failed = 0
          foreach ($r in $all) {
            if ($null -ne $r) { $failed += $r.FailedCount }
          }
          if ($failed -gt 0) { throw "$failed Pester test(s) failed across the suites" }
          Write-Host 'All Pester suites passed.'

      - name: PSScriptAnalyzer (errors)
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Scripts -Recurse -Severity Error -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table -AutoSize
            throw "$($results.Count) analyzer error(s) found"
          }
          Write-Host "No PSScriptAnalyzer errors."

      - name: Verify project metadata generator and JSON output
        # A separate write-scoped maintenance job commits refreshed metadata.
        # This read-only CI job still requires a working generator; a code
        # change should not fail solely because maintenance has not pushed.
        run: |
          pwsh -NoProfile -File ./Scripts/Index/Update-ProjectIndex.ps1
          foreach ($name in @('project-index.json','project-state.json','project-progress.json')) {
            $meta = Get-Content -LiteralPath $name -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($meta.path -ne $name) { throw "Generated project metadata invalid: $name" }
          }

  node-tests:
    name: Node.js Unit & Integration Tests (Vitest + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Verify repository version consistency
        run: node scripts/check-version-consistency.cjs

      - name: Observe existing local CI Docker image without runtime mutation
        shell: bash
        run: |
          export CI_DATABASE_IMAGE_ID="$(docker image inspect mysql:8.0 --format '{{.Id}}')"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomBytes} from 'node:crypto';
          import {inspectLocalDockerRuntime} from './scripts/local-docker-runtime-preflight.mjs';
          // The already present CI service image is a test observation only.
          // No pull/import, production publisher approval or deployment.
          const fake=()=> 'sha256:'+randomBytes(32).toString('hex');
          const result=await inspectLocalDockerRuntime({
            confirmation:'OBSERVE_LOCAL_DOCKER_ONLY',architecture:'amd64',
            imageIds:{api:fake(),database:process.env.CI_DATABASE_IMAGE_ID,ingress:fake()}
          });
          assert.equal(result.runtime_state,'LOCAL_LINUX_DAEMON_OBSERVED');
          assert.equal(result.decision,'BLOCKED');
          assert.deepEqual(result.images.map(x=>x.state),['NOT_FOUND','PINNED_ID_OBSERVED','NOT_FOUND']);
          assert.equal(result.installation_authorized,false);
          console.log('PASS: actual local Docker socket observation and missing image refusal.');
          NODE

      - name: Run Vitest unit & integration test suite (enforcing 70%+ coverage)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          VITEST: "true"
        run: npm run test:coverage

  offline-docker-load-rehearsal:
    name: Offline Docker load compatibility (disposable runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Rehearse signed fixture Docker archive load on disposable runner
        run: node tests/ci-offline-docker-load-rehearsal.mjs

  api-tests:
    name: API test suite (Node.js vs MySQL 8)
    needs: [node-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Validate OpenAPI 3.0 contract vs server.js routes
        run: node test-contract-validation.js

      - name: Run MySQL schema migrations & partitioning suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-migrations-runner.js

      - name: Rehearse durable event idempotency on real MySQL (N28)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_EVENT_DEDUP_REHEARSAL: isolated-ci
        timeout-minutes: 3
        run: timeout 120s node test-event-idempotency-mysql.js

      - name: Rehearse N29 atomic telemetry ACK replay and rollback on real MySQL
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_ATOMIC_BATCH_REHEARSAL: isolated-ci
        run: timeout 120s node test-atomic-telemetry-batch-mysql.js

      - name: Rehearse N30 protected batch receipt retention on real MySQL
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_RECEIPT_RETENTION_REHEARSAL: isolated-ci
        run: timeout 120s node test-batch-receipt-retention-mysql.js

      - name: N33 verify independent scoped MySQL receipt and redacted evidence against isolated CI database
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_STAGE33_REHEARSAL: isolated-ci
        run: timeout 150s node test-stage33-server-receipt-mysql.js

      - name: N34/N35 verify signed operator evidence, registry rotation/revocation and stale replay rejection with ephemeral CI keys
        timeout-minutes: 2
        run: node test-stage34-operator-signature.mjs

      - name: Rehearse multi-process tenant/device identity concurrency against real MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_CONCURRENCY_REHEARSAL: isolated-ci
        run: node test-device-identity-concurrency.js

      - name: Verify real cross-process HTTP tenant enrollment, one-use tokens and registration
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_HTTP_REHEARSAL: isolated-ci
        run: node test-http-tenant-concurrency.js

      - name: Rehearse workspace invitation consent and tenant configuration on real MySQL
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_WORKSPACE_REHEARSAL: isolated-ci
        run: node test-workspace-invitations-mysql.js

      - name: Inject production-mode MySQL TCP partitions and verify fail-closed recovery
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_DB_FAULT_REHEARSAL: isolated-ci
        run: node test-network-db-fault-injection.js

      - name: Verify tenant identity migration preflight catches collisions (CI temporary table)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_IDENTITY_PREFLIGHT: isolated-ci
        run: node scripts/device-identity-preflight.js --ci-fixtures

      - name: Rehearse approved global identity index DDL against disposable MySQL schema
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_IDENTITY_MIGRATION: isolated-ci
        run: node test-device-identity-index-migration.js

      - name: Start Background Server for API verification
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          PORT: 3000
          NODE_ENV: test
        run: |
          node server.js &
          echo $! > /tmp/server_pid
          READY=0
          for i in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Server ready on port 3000 (attempt $i)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start within 30 seconds"
            exit 1
          fi

      - name: Run Auth & RBAC integration test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-auth-integration.js

      - name: Run MSI packaging & artifact streaming integration suite
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test
        run: node test-msi-packaging-integration.js

      - name: Refresh repository audit reports
        env:
          NODE_ENV: test
        run: node audit/scanner.cjs

  agent-build:
    name: Build agent exe + MSI
    # N69: both diagnostic MSI and protected manually signed MSI require
    # successful Windows security/Pester validation and both DB suites.
    # A failed/pending PowerShell signing policy suite must block the signer.
    needs: [powershell-validation, node-tests, api-tests]
    runs-on: windows-latest
    # Only manually dispatched signing builds use the human-reviewed,
    # branch-restricted production-installer environment. Normal push CI
    # uses a separate environment and NEVER receives signing credentials.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'production-installer' || 'ci-diagnostic' }}
    defaults:
      run:
        shell: pwsh
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: N71 check live protected main before approved compiler downloads (manual only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/check-phase-n71-live-main-protection.cjs --live

      - name: Stage generic agent config (no server credentials baked into MSI)
        shell: pwsh
        run: |
          # This installer must work before a production server/domain exists.
          # Bootstrap credentials are acquired after installation via
          # Configure-Agent.ps1, NEVER embedded in published MSI artifacts.
          $featuresFile = if (Test-Path ./Enterprise/agent/features.json) { './Enterprise/agent/features.json' } else { './Enterprise/api/features.json' }
          $manifest = (Get-Content $featuresFile -Raw | ConvertFrom-Json).features
          $features = @($manifest | ForEach-Object {
            @{ name = $_.name; script = $_.script; enabled = [bool]$_.default_enabled; requires_elevation = [bool]$_.requires_elevation }
          })
          $agentMeta = Get-Content ./Enterprise/agent/agent-version.json -Raw | ConvertFrom-Json
          $cfg = [ordered]@{
            endpoint = ''
            enroll_url = ''
            token = ''
            bootstrap_token = ''
            needs_setup = $true
            agent_version = [string]$agentMeta.agent_version
            interval_minutes = [int]$agentMeta.interval_minutes
            features = $features
            run_script_allowlist = @()
          }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content ./Enterprise/agent/agent-config.json
          Write-Host 'Staged unprovisioned agent configuration (HTTPS setup required after MSI install).'

      - name: N67 fail closed if release payload includes unexpected config data
        shell: pwsh
        run: |
          Import-Module ./Enterprise/agent/build/ReleaseConfigAdmission.psm1 -Force
          $meta = Get-Content ./Enterprise/agent/agent-version.json -Raw | ConvertFrom-Json
          $null = Assert-N67UnprovisionedReleaseConfig `
            -ConfigPath ./Enterprise/agent/agent-config.json `
            -FeaturesPath ./Enterprise/agent/features.json `
            -ExpectedAgentVersion ([string]$meta.agent_version) `
            -ExpectedIntervalMinutes ([int]$meta.interval_minutes)

      - name: Install ps2exe
        # Diagnostic push builds are strictly non-publishable.
        if: github.event_name == 'push'
        # PS2EXE uses Windows PowerShell 5.1's .NET Framework compiler.
        shell: powershell
        run: Install-Module -Name ps2exe -RequiredVersion 1.0.18 -Repository PSGallery -Force -Scope CurrentUser

      - name: N63 install independently SHA-approved PS2EXE NUPKG (protected manual only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          PS2EXE_NUPKG_SHA256_APPROVED: ${{ secrets.PS2EXE_NUPKG_SHA256_APPROVED }}
          WIX_NUPKG_SHA256_APPROVED: ${{ secrets.WIX_NUPKG_SHA256_APPROVED }}
        run: ./Enterprise/agent/build/Install-ApprovedCompiler.ps1 -Kind ps2exe

      - name: Build agent exe
        shell: powershell
        run: ./Enterprise/agent/build/build-agent.ps1

      - name: Sign release EXE before WiX embeds it (or keep diagnostic only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
          CODESIGN_PFX_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_B64 || '' }}
          CODESIGN_PFX_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_PASSWORD || '' }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_APPROVED_THUMBPRINT || '' }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED || '' }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE3_EXE_SHA256_APPROVED || '' }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_MANIFEST_B64 || '' }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_SIGNATURE_B64 || '' }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 || '' }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED || '' }}
        run: ./Enterprise/agent/build/Release-Sign.ps1 -Stage PrePackage

      - name: Install WiX toolset
        # Diagnostic only: pinned version, but upstream package hash is not
        # independently reviewed. Protected manual builds use the next step.
        if: github.event_name == 'push'
        run: dotnet tool install --global wix --version 5.0.2

      - name: N63 install independently SHA-approved WiX NUPKG (protected manual only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PS2EXE_NUPKG_SHA256_APPROVED: ${{ secrets.PS2EXE_NUPKG_SHA256_APPROVED }}
          WIX_NUPKG_SHA256_APPROVED: ${{ secrets.WIX_NUPKG_SHA256_APPROVED }}
        run: ./Enterprise/agent/build/Install-ApprovedCompiler.ps1 -Kind wix

      - name: Build MSI
        env:
          # Protected production-installer reviewer approvals; never derive these
          # from the just-downloaded ZIP or CI-generated test fixtures.
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED || '' }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE3_EXE_SHA256_APPROVED || '' }}
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          ./Enterprise/agent/wix/build-msi.ps1

      - name: Validate MSI payload by Windows Installer administrative extraction
        shell: pwsh
        run: |
          $msi = Get-ChildItem Enterprise/agent/build/out -Filter 'IT-Toolkit-Agent-*.msi' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'WiX did not produce a versioned MSI' }
          $extracted = Join-Path $env:RUNNER_TEMP 'itk-msi-verify'
          $log = Join-Path $env:RUNNER_TEMP 'itk-msi-verify.log'
          New-Item -ItemType Directory -Path $extracted -Force | Out-Null
          $arguments = "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extracted`" /l*v `"$log`""
          $proc = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Administrative extraction failed: msiexec exit $($proc.ExitCode), see $log" }
          foreach ($name in @('IT-Toolkit-Agent.exe', 'Configure-Agent.ps1', 'Configure-Agent-GUI.ps1')) {
            $file = Get-ChildItem -Path $extracted -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "MSI payload is missing $name" }
          }
          $configs = @(Get-ChildItem -Path $extracted -Recurse -File -Filter 'agent.json')
          if ($configs.Count -eq 0) { throw 'MSI payload is missing unprovisioned agent.json' }
          foreach ($entry in $configs) {
            $cfg = Get-Content -LiteralPath $entry.FullName -Raw | ConvertFrom-Json
            if (-not $cfg.needs_setup -or $cfg.endpoint -or $cfg.token -or $cfg.bootstrap_token) {
              throw "MSI contains a server endpoint or credential: $($entry.FullName)"
            }
          }
          Write-Host 'MSI administrative extraction passed; GUI, worker and blank setup config included.'

      - name: N71 recheck protected main before final MSI signing (manual only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/check-phase-n71-live-main-protection.cjs --live

      - name: Verify pre-signed MSI payload and sign release MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
          CODESIGN_PFX_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_B64 || '' }}
          CODESIGN_PFX_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_PASSWORD || '' }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_APPROVED_THUMBPRINT || '' }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE3_EXE_SHA256_APPROVED || '' }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED || '' }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_MANIFEST_B64 || '' }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_SIGNATURE_B64 || '' }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 || '' }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ github.event_name == 'workflow_dispatch' && secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED || '' }}
        run: |
          if ($env:RELEASE_SIGNING_ENABLED -eq 'true') {
            # N54 verify the *embedded* executable after administrative MSI
            # extraction and before signing the final distributable package.
            Import-Module ./Enterprise/agent/wix/SqliteBundleApproval.psm1 -Force
            $sqlitePayloads = @(Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'itk-msi-verify') -Recurse -File -Filter 'sqlite3.exe')
            if ($sqlitePayloads.Count -ne 1) { throw 'N54 MSI requires exactly one SQLite executable payload.' }
            $null = Assert-N54ApprovedSqliteFile -Path $sqlitePayloads[0].FullName -Kind Executable -ApprovedSha256 $env:SQLITE3_EXE_SHA256_APPROVED
            $embedded = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'itk-msi-verify') -Recurse -File -Filter 'IT-Toolkit-Agent.exe' | Select-Object -First 1
            if (-not $embedded) { throw 'MSI did not embed signed agent EXE.' }
            $original = 'Enterprise/agent/build/out/IT-Toolkit-Agent.exe'
            if ((Get-FileHash -LiteralPath $embedded.FullName -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash) { throw 'MSI payload did not match pre-signed EXE.' }
          }
          ./Enterprise/agent/build/Release-Sign.ps1 -Stage Finalize

      - name: Rehearse real Windows MSI install, post-setup and clean uninstall
        shell: pwsh
        run: |
          try {
            ./Enterprise/tests/Test-Windows-MsiInstall.ps1
          } catch {
            # Summarize failing MSI custom actions without publishing the
            # entire installer log or any local user/environment secrets.
            $log = Join-Path $env:RUNNER_TEMP 'itk-msi-install-rehearsal/install.log'
            if (Test-Path -LiteralPath $log) {
              Write-Host 'Last MSI error/action diagnostics:'
              Get-Content -LiteralPath $log -Tail 120 |
                Where-Object { $_ -match 'Return value 3|error |Error |CustomAction|CreateSchedTask|HardenAgentDataAcl|HardenLocalJsonAcl' } |
                Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
            }
            throw
          }

      - name: Rehearse Windows MSI major upgrade and tenant configuration preservation
        shell: pwsh
        run: |
          try {
            ./Enterprise/tests/Test-Windows-MsiUpgrade.ps1
          } catch {
            $logRoot = Join-Path $env:RUNNER_TEMP 'itk-msi-upgrade-rehearsal'
            if (Test-Path -LiteralPath $logRoot) {
              Get-ChildItem -LiteralPath $logRoot -Filter '*.log' | ForEach-Object {
                Write-Host "MSI upgrade diagnostics from $($_.Name):"
                Get-Content -LiteralPath $_.FullName -Tail 120 |
                  Where-Object { $_ -match 'Return value 3|error |Error |CustomAction|FindRelatedProducts|RemoveExistingProducts' } |
                  Select-Object -Last 15 | ForEach-Object { Write-Host $_ }
              }
            }
            throw
          }

      - name: Verify final signed artifact publication
        if: env.PUBLISH_SIGNED == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          CODESIGN_APPROVED_THUMBPRINT: ${{ secrets.CODESIGN_APPROVED_THUMBPRINT }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ secrets.SQLITE3_EXE_SHA256_APPROVED }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ secrets.RELEASE_APPROVAL_MANIFEST_B64 }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ secrets.RELEASE_APPROVAL_SIGNATURE_B64 }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED }}
        run: ./Enterprise/agent/build/Verify-SignedPublication.ps1

      - name: N58 record final verified source reviewer approval identity
        if: env.PUBLISH_SIGNED == 'true' && env.PUBLICATION_VERIFIED == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          CODESIGN_APPROVED_THUMBPRINT: ${{ secrets.CODESIGN_APPROVED_THUMBPRINT }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ secrets.SQLITE3_EXE_SHA256_APPROVED }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ secrets.RELEASE_APPROVAL_MANIFEST_B64 }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ secrets.RELEASE_APPROVAL_SIGNATURE_B64 }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED }}
        run: ./Enterprise/agent/build/Write-SourceReleaseApprovalReceipt.ps1

      - name: Upload verified signed artifacts only
        if: env.PUBLISH_SIGNED == 'true' && env.PUBLICATION_VERIFIED == 'true' && env.RELEASE_APPROVAL_RECEIPT_VERIFIED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: it-toolkit-agent
          path: |
            Enterprise/agent/build/out/*.exe
            Enterprise/agent/build/out/*.msi
            Enterprise/agent/build/out/SHA256SUMS.txt
            Enterprise/agent/build/out/agent-config.json
            Enterprise/agent/build/out/RELEASE-APPROVAL-SHA256.txt

