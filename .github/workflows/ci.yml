name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sunday midnight
  workflow_dispatch:

jobs:
  powershell-validation:
    name: PowerShell validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse all PowerShell files
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $errors++
              Write-Host "PARSE FAIL: $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message) @ line $($_.Extent.StartLineNumber)" }
            }
          }
          if ($errors -gt 0) { throw "$errors file(s) failed to parse" }
          Write-Host "All PowerShell files parse cleanly."

      - name: Validate JSON config
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.json' |
            Where-Object {
              $_.FullName -notmatch '[/\\](node_modules|\.git)[/\\]'
            }

          foreach ($file in $files) {
            try {
              $null = Get-Content -LiteralPath $file.FullName -Raw |
                ConvertFrom-Json -AsHashtable -ErrorAction Stop

              Write-Host "JSON OK: $($file.FullName)"
            }
            catch {
              throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
            }
          }

      - name: Run Phase 1 regression suite
        run: pwsh -NoProfile -File ./Scripts/Tests/Phase1-Regression.Tests.ps1

      - name: Run Pester suites (RemoteToolkit, BatchLauncher, Phase2 modules)
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 6 })) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester
          $all = @(
            (Invoke-Pester -Path ./Scripts/Tests/RemoteToolkit.tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/BatchLauncher.Tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/Phase2-Modules.Tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/AgentCommandTrust.Tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/AgentElevationPolicy.Tests.ps1 -Output Normal -PassThru)
          )
          $failed = 0
          foreach ($r in $all) {
            if ($null -ne $r) { $failed += $r.FailedCount }
          }
          if ($failed -gt 0) { throw "$failed Pester test(s) failed across the suites" }
          Write-Host 'All Pester suites passed.'

      - name: PSScriptAnalyzer (errors)
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Scripts -Recurse -Severity Error -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table -AutoSize
            throw "$($results.Count) analyzer error(s) found"
          }
          Write-Host "No PSScriptAnalyzer errors."

      - name: Verify project index is up to date
        run: |
          pwsh -NoProfile -File ./Scripts/Index/Update-ProjectIndex.ps1 -Check

  node-tests:
    name: Node.js Unit & Integration Tests (Vitest + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Verify repository version consistency
        run: node scripts/check-version-consistency.cjs

      - name: Run Vitest unit & integration test suite (enforcing 70%+ coverage)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          VITEST: "true"
        run: npm run test:coverage

  api-tests:
    name: API test suite (Node.js vs MySQL 8)
    needs: [node-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Validate OpenAPI 3.0 contract vs server.js routes
        run: node test-contract-validation.js

      - name: Run MySQL schema migrations & partitioning suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-migrations-runner.js

      - name: Start Background Server for API verification
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          PORT: 3000
          NODE_ENV: test
        run: |
          node server.js &
          echo $! > /tmp/server_pid
          READY=0
          for i in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Server ready on port 3000 (attempt $i)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start within 30 seconds"
            exit 1
          fi

      - name: Run Auth & RBAC integration test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-auth-integration.js

      - name: Run MSI packaging & artifact streaming integration suite
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test
        run: node test-msi-packaging-integration.js

      - name: Refresh repository audit reports
        env:
          NODE_ENV: test
        run: node audit/scanner.cjs

  agent-build:
    name: Build agent exe + MSI
    needs: [node-tests, api-tests]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    if: github.event_name == 'workflow_dispatch' # Signed release is explicitly initiated; never auto-publish on main pushes.
    steps:
      - uses: actions/checkout@v4

      - name: Stage credential-free agent config (release requires post-install enrollment)
        shell: pwsh
        run: |
          $meta = Get-Content ./Enterprise/agent/agent-version.json -Raw | ConvertFrom-Json
          $cfg = [ordered]@{
            endpoint = 'https://127.0.0.1:9443/api/v1/ingest/telemetry'
            enroll_url = ''
            token = ''
            agent_version = [string]$meta.agent_version
            interval_minutes = [int]$meta.interval_minutes
            run_script_allowlist = @()
            deployment_state = 'UNENROLLED'
            features = @()
          }
          $cfg | ConvertTo-Json -Depth 8 | Set-Content ./Enterprise/agent/agent-config.json
          & ./Enterprise/agent/wix/Assert-PackagingConfig.ps1 -ConfigFile ./Enterprise/agent/agent-config.json
      - name: Install ps2exe
        # MScholtes/PS2EXE requires Windows PowerShell 5.1 (uses the .NET
        # Framework compiler); it fails under pwsh (PowerShell 7).
        shell: powershell
        run: Install-Module ps2exe -RequiredVersion '1.0.18' -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Build agent exe
        shell: powershell
        run: ./Enterprise/agent/build/build-agent.ps1

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version "5.*"

      - name: Build MSI
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          ./Enterprise/agent/wix/build-msi.ps1

      - name: Code-sign and validate EXE + MSI using trusted release certificate
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $out = 'Enterprise/agent/build/out'
          $targets = @(Join-Path $out 'IT-Toolkit-Agent.exe') + @(Get-ChildItem -Path $out -Filter '*.msi' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if (-not $env:CODESIGN_PFX_B64 -or -not $env:CODESIGN_PFX_PASSWORD) {
            throw 'Release blocked: both code-signing PFX and password are required. Unsigned installers cannot be published.'
          }
          if ($targets.Count -lt 2) { throw 'Release blocked: missing real EXE or MSI build output.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))

          # signtool ships with the Windows SDK (present on windows-latest)
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdk -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\d+\.\d+\.\d+\.\d+\\x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found under Windows SDK' }

          # Do not import an untrusted repository CA into this runner.
          # Authenticating the release publisher must use the Windows trust
          # store and a separately approved signing certificate chain.

          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { continue }
            # Timestamp and a trusted chain are mandatory for a releasable MSI.
            & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 $t
            if ($LASTEXITCODE -ne 0) { throw "Release blocked: code-signing or timestamp failed on $t" }
            & $signtool.FullName verify /pa /v $t
            if ($LASTEXITCODE -ne 0) { throw "Release blocked: untrusted or invalid signature on $t" }
            Write-Host "Signed: $t"
          }

      - name: Generate signed release manifest only after successful verification
        shell: pwsh
        run: |
          $dir = 'Enterprise/agent/build/out'
          $msi = Get-ChildItem -Path $dir -Filter '*.msi' -File |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 65536) {
            throw 'Cannot manifest nonexistent or placeholder MSI.'
          }
          $auth = Get-AuthenticodeSignature -LiteralPath $msi.FullName
          if ($auth.Status -ne 'Valid' -or -not $auth.SignerCertificate) {
            throw "Cannot release: MSI Authenticode signature not trusted ($($auth.Status))."
          }
          if (-not $auth.TimeStamperCertificate) {
            throw 'Cannot release: MSI has no verified timestamp signer.'
          }
          $meta = Get-Content './Enterprise/agent/agent-version.json' -Raw | ConvertFrom-Json
          $manifest = [ordered]@{
            version = [string]$meta.agent_version
            filename = [string]$msi.Name
            sha256 = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signed = $true
            authenticode_verified = $true
            timestamp_verified = $true
            publisher = [string]$auth.SignerCertificate.Subject
            certificate_thumbprint = [string]$auth.SignerCertificate.Thumbprint
            built_by = 'GitHub Actions manual signed release gate'
          }
          $manifest | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $dir 'release-manifest.json') -Encoding UTF8
          Write-Host 'Signed release manifest emitted for host-side administrator deployment.'

      - name: Upload approved signed artifacts (sign+verify step must pass)
        uses: actions/upload-artifact@v4
        with:
          name: it-toolkit-agent
          path: |
            Enterprise/agent/build/out/*.exe
            Enterprise/agent/build/out/*.msi
            Enterprise/agent/build/out/agent-config.json
            Enterprise/agent/build/out/release-manifest.json
