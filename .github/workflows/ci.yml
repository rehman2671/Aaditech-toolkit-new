name: CI

# Running superseded push builds wastes Windows runners and delays the
# newest production-security acceptance result. Manual runs are isolated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sunday midnight
  workflow_dispatch:

jobs:
  powershell-validation:
    name: PowerShell validation
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse all PowerShell files
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $errors++
              Write-Host "PARSE FAIL: $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Message) @ line $($_.Extent.StartLineNumber)" }
            }
          }
          if ($errors -gt 0) { throw "$errors file(s) failed to parse" }
          Write-Host "All PowerShell files parse cleanly."

      - name: Validate JSON config
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.json' |
            Where-Object {
              $_.FullName -notmatch '[/\\](node_modules|\.git)[/\\]'
            }

          foreach ($file in $files) {
            try {
              $null = Get-Content -LiteralPath $file.FullName -Raw |
                ConvertFrom-Json -AsHashtable -ErrorAction Stop

              Write-Host "JSON OK: $($file.FullName)"
            }
            catch {
              throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
            }
          }

      - name: Run Phase 1 regression suite
        run: pwsh -NoProfile -File ./Scripts/Tests/Phase1-Regression.Tests.ps1

      - name: Test generic MSI HTTPS setup and server reconfiguration
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-ConfigureAgent.ps1
      - name: Test per-device signed command verification in installed worker
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-CommandVerification.ps1
      - name: Test one-use enrollment bootstrap token is cleared after provisioning
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-EnrollmentBootstrapCleanup.ps1

      - name: Exercise canonical agent idle telemetry and durable ACK handling (N27)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-CanonicalAgent-AckCadence.ps1

      - name: Verify unsigned MSI publication fails closed and invalid certificates are rejected
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-ReleaseSigningGates.ps1

      - name: N31 customer Windows preflight fails closed without configuration or consent
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage31WindowsPreflight.ps1

      - name: N38 refuse unpinned Windows live network probe, preserve offline redacted evidence
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage38WindowsNetworkProbe.ps1

      - name: N39 Windows public DNS policy rejects private/mixed addresses offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage39WindowsPublicAddressPolicy.ps1

      - name: N40 Windows HTTPS endpoint admission rejects unsafe origins offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage40WindowsEndpointPreflight.ps1

      - name: N41 Windows health response rejects ambiguous and degraded JSON offline
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage41WindowsHealthJson.ps1

      - name: N41 verify compatibility with actual Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage41WindowsHealthJson.ps1

      - name: N42 offline pinned HTTPS plan, consent and immutable report regression (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage42WindowsPinnedHttps.ps1

      - name: N42 verify offline pinned HTTPS plan on Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage42WindowsPinnedHttps.ps1

      - name: N43 synthetic TLS/redirect/timeout/size fault injection and hostname-bound consent (PowerShell 7)
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage43WindowsPinnedHttpsFaults.ps1

      - name: N43 synthetic TLS/redirect/timeout/size fault injection on real Windows PowerShell 5.1
        shell: powershell
        run: ./Enterprise/tests/Test-Stage43WindowsPinnedHttpsFaults.ps1


      - name: N31 release publication requires independently approved source and MSI pins
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage31PublicationPins.ps1

      - name: N32 redacted replay evidence and consent/immutability regression
        run: pwsh -NoProfile -File ./Enterprise/tests/Test-Stage32CustomerEvidence.ps1

      - name: N34/N35 operator Ed25519, registry revocation/rotation and signed customer evidence bundle (CI-only keys)
        run: node ./test-stage34-operator-signature.mjs

      - name: Run Pester suites (RemoteToolkit, BatchLauncher, Phase2 modules)
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version.Major -ge 6 })) {
            Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester
          $all = @(
            (Invoke-Pester -Path ./Scripts/Tests/RemoteToolkit.tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/BatchLauncher.Tests.ps1 -Output Normal -PassThru),
            (Invoke-Pester -Path ./Scripts/Tests/Phase2-Modules.Tests.ps1 -Output Normal -PassThru)
          )
          $failed = 0
          foreach ($r in $all) {
            if ($null -ne $r) { $failed += $r.FailedCount }
          }
          if ($failed -gt 0) { throw "$failed Pester test(s) failed across the suites" }
          Write-Host 'All Pester suites passed.'

      - name: PSScriptAnalyzer (errors)
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./Scripts -Recurse -Severity Error -ErrorAction SilentlyContinue
          if ($results) {
            $results | Format-Table -AutoSize
            throw "$($results.Count) analyzer error(s) found"
          }
          Write-Host "No PSScriptAnalyzer errors."

      - name: Verify project metadata generator and JSON output
        # A separate write-scoped maintenance job commits refreshed metadata.
        # This read-only CI job still requires a working generator; a code
        # change should not fail solely because maintenance has not pushed.
        run: |
          pwsh -NoProfile -File ./Scripts/Index/Update-ProjectIndex.ps1
          foreach ($name in @('project-index.json','project-state.json','project-progress.json')) {
            $meta = Get-Content -LiteralPath $name -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($meta.path -ne $name) { throw "Generated project metadata invalid: $name" }
          }

  node-tests:
    name: Node.js Unit & Integration Tests (Vitest + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Verify repository version consistency
        run: node scripts/check-version-consistency.cjs

      - name: Run Vitest unit & integration test suite (enforcing 70%+ coverage)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          VITEST: "true"
        run: npm run test:coverage

  api-tests:
    name: API test suite (Node.js vs MySQL 8)
    needs: [node-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: it_toolkit
          MYSQL_USER: itk_user
          MYSQL_PASSWORD: itk_password_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate ephemeral CI security credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const names = [
            'JWT_SECRET',
            'BOOTSTRAP_SECRET',
            'COMMAND_SIGNING_KEY',
            'HMAC_SECRET',
            'API_TOKEN'
          ];

          for (const name of names) {
            const value = crypto.randomBytes(32).toString('hex');

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `${name}=${value}\n`
            );
          }
          NODE

      - name: Lint and syntax validation
        run: npm run lint

      - name: Validate OpenAPI 3.0 contract vs server.js routes
        run: node test-contract-validation.js

      - name: Run MySQL schema migrations & partitioning suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-migrations-runner.js

      - name: Rehearse durable event idempotency on real MySQL (N28)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_EVENT_DEDUP_REHEARSAL: isolated-ci
        timeout-minutes: 3
        run: timeout 120s node test-event-idempotency-mysql.js

      - name: Rehearse N29 atomic telemetry ACK replay and rollback on real MySQL
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_ATOMIC_BATCH_REHEARSAL: isolated-ci
        run: timeout 120s node test-atomic-telemetry-batch-mysql.js

      - name: Rehearse N30 protected batch receipt retention on real MySQL
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_RECEIPT_RETENTION_REHEARSAL: isolated-ci
        run: timeout 120s node test-batch-receipt-retention-mysql.js

      - name: N33 verify independent scoped MySQL receipt and redacted evidence against isolated CI database
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_STAGE33_REHEARSAL: isolated-ci
        run: timeout 150s node test-stage33-server-receipt-mysql.js

      - name: N34/N35 verify signed operator evidence, registry rotation/revocation and stale replay rejection with ephemeral CI keys
        timeout-minutes: 2
        run: node test-stage34-operator-signature.mjs

      - name: Rehearse multi-process tenant/device identity concurrency against real MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_CONCURRENCY_REHEARSAL: isolated-ci
        run: node test-device-identity-concurrency.js

      - name: Verify real cross-process HTTP tenant enrollment, one-use tokens and registration
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_HTTP_REHEARSAL: isolated-ci
        run: node test-http-tenant-concurrency.js

      - name: Rehearse workspace invitation consent and tenant configuration on real MySQL
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_WORKSPACE_REHEARSAL: isolated-ci
        run: node test-workspace-invitations-mysql.js

      - name: Inject production-mode MySQL TCP partitions and verify fail-closed recovery
        timeout-minutes: 5
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_DB_FAULT_REHEARSAL: isolated-ci
        run: node test-network-db-fault-injection.js

      - name: Verify tenant identity migration preflight catches collisions (CI temporary table)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_IDENTITY_PREFLIGHT: isolated-ci
        run: node scripts/device-identity-preflight.js --ci-fixtures

      - name: Rehearse approved global identity index DDL against disposable MySQL schema
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
          AADITECH_IDENTITY_MIGRATION: isolated-ci
        run: node test-device-identity-index-migration.js

      - name: Start Background Server for API verification
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          PORT: 3000
          NODE_ENV: test
        run: |
          node server.js &
          echo $! > /tmp/server_pid
          READY=0
          for i in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Server ready on port 3000 (attempt $i)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server failed to start within 30 seconds"
            exit 1
          fi

      - name: Run Auth & RBAC integration test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: itk_user
          DB_PASSWORD: itk_password_ci
          DB_NAME: it_toolkit
          NODE_ENV: test
        run: node test-auth-integration.js

      - name: Run MSI packaging & artifact streaming integration suite
        env:
          BASE_URL: http://127.0.0.1:3000
          NODE_ENV: test
        run: node test-msi-packaging-integration.js

      - name: Refresh repository audit reports
        env:
          NODE_ENV: test
        run: node audit/scanner.cjs

  agent-build:
    name: Build agent exe + MSI
    needs: [node-tests, api-tests]
    runs-on: windows-latest
    # Only manually dispatched signing builds use the human-reviewed,
    # branch-restricted production-installer environment. Normal push CI
    # uses a separate environment and NEVER receives signing credentials.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'production-installer' || 'ci-diagnostic' }}
    defaults:
      run:
        shell: pwsh
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Stage generic agent config (no server credentials baked into MSI)
        shell: pwsh
        run: |
          # This installer must work before a production server/domain exists.
          # Bootstrap credentials are acquired after installation via
          # Configure-Agent.ps1, NEVER embedded in published MSI artifacts.
          $featuresFile = if (Test-Path ./Enterprise/agent/features.json) { './Enterprise/agent/features.json' } else { './Enterprise/api/features.json' }
          $manifest = (Get-Content $featuresFile -Raw | ConvertFrom-Json).features
          $features = @($manifest | ForEach-Object {
            @{ name = $_.name; script = $_.script; enabled = [bool]$_.default_enabled; requires_elevation = [bool]$_.requires_elevation }
          })
          $agentMeta = Get-Content ./Enterprise/agent/agent-version.json -Raw | ConvertFrom-Json
          $cfg = [ordered]@{
            endpoint = ''
            enroll_url = ''
            token = ''
            bootstrap_token = ''
            needs_setup = $true
            agent_version = [string]$agentMeta.agent_version
            interval_minutes = [int]$agentMeta.interval_minutes
            features = $features
            run_script_allowlist = @()
          }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content ./Enterprise/agent/agent-config.json
          Write-Host 'Staged unprovisioned agent configuration (HTTPS setup required after MSI install).'

      - name: Install ps2exe
        # MScholtes/PS2EXE requires Windows PowerShell 5.1 (uses the .NET
        # Framework compiler); it fails under pwsh (PowerShell 7).
        shell: powershell
        run: Install-Module ps2exe -Force -Scope CurrentUser

      - name: Build agent exe
        shell: powershell
        run: ./Enterprise/agent/build/build-agent.ps1

      - name: Sign release EXE before WiX embeds it (or keep diagnostic only)
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_B64 || '' }}
          CODESIGN_PFX_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_PASSWORD || '' }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_APPROVED_THUMBPRINT || '' }}
        run: ./Enterprise/agent/build/Release-Sign.ps1 -Stage PrePackage

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version "5.*"

      - name: Build MSI
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          ./Enterprise/agent/wix/build-msi.ps1

      - name: Validate MSI payload by Windows Installer administrative extraction
        shell: pwsh
        run: |
          $msi = Get-ChildItem Enterprise/agent/build/out -Filter 'IT-Toolkit-Agent-*.msi' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'WiX did not produce a versioned MSI' }
          $extracted = Join-Path $env:RUNNER_TEMP 'itk-msi-verify'
          $log = Join-Path $env:RUNNER_TEMP 'itk-msi-verify.log'
          New-Item -ItemType Directory -Path $extracted -Force | Out-Null
          $arguments = "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$extracted`" /l*v `"$log`""
          $proc = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Administrative extraction failed: msiexec exit $($proc.ExitCode), see $log" }
          foreach ($name in @('IT-Toolkit-Agent.exe', 'Configure-Agent.ps1', 'Configure-Agent-GUI.ps1')) {
            $file = Get-ChildItem -Path $extracted -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "MSI payload is missing $name" }
          }
          $configs = @(Get-ChildItem -Path $extracted -Recurse -File -Filter 'agent.json')
          if ($configs.Count -eq 0) { throw 'MSI payload is missing unprovisioned agent.json' }
          foreach ($entry in $configs) {
            $cfg = Get-Content -LiteralPath $entry.FullName -Raw | ConvertFrom-Json
            if (-not $cfg.needs_setup -or $cfg.endpoint -or $cfg.token -or $cfg.bootstrap_token) {
              throw "MSI contains a server endpoint or credential: $($entry.FullName)"
            }
          }
          Write-Host 'MSI administrative extraction passed; GUI, worker and blank setup config included.'

      - name: Verify pre-signed MSI payload and sign release MSI
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_B64 || '' }}
          CODESIGN_PFX_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_PFX_PASSWORD || '' }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ github.event_name == 'workflow_dispatch' && secrets.CODESIGN_APPROVED_THUMBPRINT || '' }}
        run: |
          if ($env:RELEASE_SIGNING_ENABLED -eq 'true') {
            $embedded = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'itk-msi-verify') -Recurse -File -Filter 'IT-Toolkit-Agent.exe' | Select-Object -First 1
            if (-not $embedded) { throw 'MSI did not embed signed agent EXE.' }
            $original = 'Enterprise/agent/build/out/IT-Toolkit-Agent.exe'
            if ((Get-FileHash -LiteralPath $embedded.FullName -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash) { throw 'MSI payload did not match pre-signed EXE.' }
          }
          ./Enterprise/agent/build/Release-Sign.ps1 -Stage Finalize

      - name: Rehearse real Windows MSI install, post-setup and clean uninstall
        shell: pwsh
        run: |
          try {
            ./Enterprise/tests/Test-Windows-MsiInstall.ps1
          } catch {
            # Summarize failing MSI custom actions without publishing the
            # entire installer log or any local user/environment secrets.
            $log = Join-Path $env:RUNNER_TEMP 'itk-msi-install-rehearsal/install.log'
            if (Test-Path -LiteralPath $log) {
              Write-Host 'Last MSI error/action diagnostics:'
              Get-Content -LiteralPath $log -Tail 120 |
                Where-Object { $_ -match 'Return value 3|error |Error |CustomAction|CreateSchedTask|HardenAgentDataAcl|HardenLocalJsonAcl' } |
                Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
            }
            throw
          }

      - name: Rehearse Windows MSI major upgrade and tenant configuration preservation
        shell: pwsh
        run: |
          try {
            ./Enterprise/tests/Test-Windows-MsiUpgrade.ps1
          } catch {
            $logRoot = Join-Path $env:RUNNER_TEMP 'itk-msi-upgrade-rehearsal'
            if (Test-Path -LiteralPath $logRoot) {
              Get-ChildItem -LiteralPath $logRoot -Filter '*.log' | ForEach-Object {
                Write-Host "MSI upgrade diagnostics from $($_.Name):"
                Get-Content -LiteralPath $_.FullName -Tail 120 |
                  Where-Object { $_ -match 'Return value 3|error |Error |CustomAction|FindRelatedProducts|RemoveExistingProducts' } |
                  Select-Object -Last 15 | ForEach-Object { Write-Host $_ }
              }
            }
            throw
          }

      - name: Upload verified signed artifacts only
        if: env.PUBLISH_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: it-toolkit-agent
          path: |
            Enterprise/agent/build/out/*.exe
            Enterprise/agent/build/out/*.msi
            Enterprise/agent/build/out/SHA256SUMS.txt
            Enterprise/agent/build/out/agent-config.json
