name: Deployment safety regression

on:
  push:
    branches: [main]
    paths:
      - 'Enterprise/deploy/**'
      - 'Enterprise/tests/Test-MySQL-Backup-Restore.sh'
      - 'Enterprise/tests/Test-Stage14Preflight.sh'
      - 'Enterprise/tests/Test-DeployMySQL.sh'
      - 'Enterprise/tests/Test-LegacyMsiMigration.sh'
      - 'Enterprise/tests/Test-LegacyMsiMigration-Live.sh'
      - 'Enterprise/tests/Test-MySQL-Live-Rehearsal.sh'
      - '.github/workflows/deployment-safety.yml'
  pull_request:
    paths:
      - 'Enterprise/deploy/**'
      - 'Enterprise/tests/Test-MySQL-Backup-Restore.sh'
      - 'Enterprise/tests/Test-Stage14Preflight.sh'
      - 'Enterprise/tests/Test-DeployMySQL.sh'
      - 'Enterprise/tests/Test-LegacyMsiMigration.sh'
      - 'Enterprise/tests/Test-LegacyMsiMigration-Live.sh'
      - 'Enterprise/tests/Test-MySQL-Live-Rehearsal.sh'
      - '.github/workflows/deployment-safety.yml'
  workflow_dispatch:

jobs:
  mysql-backup-restore:
    name: Bash syntax and offline database recovery tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment script syntax
        shell: bash
        run: |
          bash -n Enterprise/deploy/deploy.sh
          bash -n Enterprise/deploy/deploy-mysql.sh
          bash -n Enterprise/deploy/backup.sh
          bash -n Enterprise/deploy/restore.sh
          bash -n Enterprise/deploy/migrate-legacy-msi-bootstrap.sh
          bash -n Enterprise/deploy/preflight-stage14.sh
          bash -n Enterprise/tests/Test-Stage14Preflight.sh
          bash -n Enterprise/tests/Test-LegacyMsiMigration-Live.sh
          bash -n Enterprise/deploy/verify-hostinger-acceptance.sh
      - name: Verify VPS public HTTPS acceptance CLI is safe in offline dry-run
        shell: bash
        run: bash Enterprise/deploy/verify-hostinger-acceptance.sh --host toolkit.aaditech.net --dry-run
      - name: Verify MySQL backup and restore safety controls
        shell: bash
        run: bash Enterprise/tests/Test-MySQL-Backup-Restore.sh
      - name: Verify HTTPS/MySQL deployment dry-run isolation
        shell: bash
        run: bash Enterprise/tests/Test-DeployMySQL.sh
      - name: Verify configuration and signed release preflight reject unsafe inputs
        shell: bash
        run: bash Enterprise/tests/Test-Stage14Preflight.sh
      - name: Verify legacy bootstrap migration refuses unsafe operations
        shell: bash
        run: bash Enterprise/tests/Test-LegacyMsiMigration.sh

  mysql-live-rehearsal:
    name: Isolated MySQL 8 backup and restore data integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary CI-only MySQL credentials
        shell: bash
        run: |
          umask 077
          {
            echo 'COMPOSE_PROJECT_NAME=itk_rehearsal_${{ github.run_id }}'
            echo 'MYSQL_DATABASE=it_toolkit_rehearsal'
            echo 'MYSQL_USER=itk_ci_user'
            for name in MYSQL_ROOT_PASSWORD MYSQL_PASSWORD API_TOKEN JWT_SECRET HMAC_SECRET BOOTSTRAP_SECRET COMMAND_SIGNING_KEY SETUP_TOKEN; do
              echo "${name}=$(openssl rand -hex 32)"
            done
            echo 'SERVER_HOST=ci.example.org'
            echo 'CADDY_HOST=ci.example.org'
            echo 'ENVIRONMENT=prod'
          } > Enterprise/.env
          chmod 600 Enterprise/.env
      - name: Verify compose substitution and run real database recovery rehearsal
        shell: bash
        run: |
          bash -n Enterprise/tests/Test-MySQL-Live-Rehearsal.sh
          docker compose --env-file Enterprise/.env -f Enterprise/docker-compose.yml config --quiet
          AADITECH_REHEARSAL=isolated-ci bash Enterprise/tests/Test-MySQL-Live-Rehearsal.sh
      - name: Rehearse historic MSI token migration in disposable MySQL 8
        shell: bash
        run: AADITECH_REHEARSAL=isolated-ci bash Enterprise/tests/Test-LegacyMsiMigration-Live.sh
      - name: Tear down disposable CI database
        if: always()
        shell: bash
        run: |
          if [ -f Enterprise/.env ]; then
            docker compose --env-file Enterprise/.env -f Enterprise/docker-compose.yml down -v --remove-orphans || true
          fi
