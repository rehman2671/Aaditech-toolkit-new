name: Project index maintenance

# N57: serial main metadata publication. The job regenerates from the latest
# main HEAD, never rebases an obsolete generated JSON snapshot over new code.
# Writes remain restricted to the three generated project metadata files.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-index-maintenance-main
  # Do not interrupt a checked-out generation after another main push.
  # Every run rechecks the *latest* HEAD and becomes a no-op if already fresh.
  cancel-in-progress: false

jobs:
  refresh-index:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Validate bounded non-force index publisher syntax
        shell: bash
        run: bash -n Scripts/Index/Publish-ProjectIndex.sh
      - name: Regenerate and safely publish latest project index
        shell: bash
        run: bash Scripts/Index/Publish-ProjectIndex.sh
