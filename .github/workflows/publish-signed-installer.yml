name: Publish approved signed Windows installer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Human-approved manual main CI run ID containing verified signed it-toolkit-agent artifact
        type: string
        required: true
      approved_source_sha:
        description: Independently human-reviewed full 40-hex CI source commit SHA (must match source run)
        type: string
        required: true
      approved_msi_sha256:
        description: Independently reviewed MSI SHA256 checksum (64 hex), NOT copied automatically from downloaded artifact
        type: string
        required: true
      release_tag:
        description: Version + MSI revision (example agent-v1.1.2-r1)
        type: string
        required: true
      confirmation:
        description: Type PUBLISH_SIGNED_AGENT after operator approval
        type: string
        required: true

permissions:
  contents: write
  actions: read

# One protected publisher per release tag: never cancel a draft-in-progress
# mid-upload. The exact tag/source checks still reject duplicate releases.
concurrency:
  group: signed-windows-installer-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish only independently verified signed installer
    if: github.ref == 'refs/heads/main'
    environment: production-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source GitHub CI run provenance and manual confirmation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.source_run_id }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          APPROVED_MSI_SHA256: ${{ inputs.approved_msi_sha256 }}
          APPROVAL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:APPROVAL_CONFIRMATION -cne 'PUBLISH_SIGNED_AGENT') { throw 'Manual approval phrase missing.' }
          if ($env:CI_RUN_ID -notmatch '^[0-9]{6,20}$') { throw 'Invalid CI run ID.' }
          if ($env:APPROVED_SOURCE_SHA -cnotmatch '^[0-9a-fA-F]{40}$') { throw 'Human-approved source commit SHA is required.' }
          if ($env:APPROVED_MSI_SHA256 -cnotmatch '^[0-9a-fA-F]{64}$') { throw 'Human-approved MSI SHA256 is required.' }
          $source = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $source) { throw 'Could not confirm CI provenance.' }
          # Signed artifacts now originate ONLY from a human-approved,
          # manually dispatched main-branch CI build, not a normal push.
          if ($source.name -ne 'CI' -or $source.path -cne '.github/workflows/ci.yml' -or
              $source.event -ne 'workflow_dispatch' -or
              $source.conclusion -ne 'success' -or $source.head_branch -ne 'main' -or
              $source.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $source.head_sha -notmatch '^[0-9a-f]{40}$' -or
              $source.head_sha -cne $env:APPROVED_SOURCE_SHA.ToLowerInvariant()) {
            throw 'Source must be a successful manually dispatched same-repository main branch CI run.'
          }
          "SOURCE_SHA=$($source.head_sha)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: it-toolkit-agent
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: N58 verify same signed source reviewer approval and artifact receipt
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ secrets.CODESIGN_APPROVED_THUMBPRINT }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ secrets.SQLITE3_EXE_SHA256_APPROVED }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ secrets.RELEASE_APPROVAL_MANIFEST_B64 }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ secrets.RELEASE_APPROVAL_SIGNATURE_B64 }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED }}
        run: |
          ./Enterprise/agent/build/Assert-PublicationReviewerApproval.ps1 -ArtifactDir release -ApprovedSourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG

      - name: Verify version and exact trusted EXE/MSI publisher, timestamp and payload
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ secrets.CODESIGN_APPROVED_THUMBPRINT }}
          APPROVED_MSI_SHA256: ${{ inputs.approved_msi_sha256 }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ secrets.SQLITE3_EXE_SHA256_APPROVED }}
        run: |
          $metadata = Get-Content -LiteralPath Enterprise/agent/agent-version.json -Raw | ConvertFrom-Json
          $expected = "agent-v$($metadata.agent_version)-r$($metadata.msi_revision)"
          if ($env:RELEASE_TAG -cne $expected) { throw "This source requires tag $expected." }
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_APPROVED_THUMBPRINT)) {
            throw 'Approved publisher certificate thumbprint secret missing.'
          }
          ./Enterprise/agent/build/Verify-ReleaseArtifact.ps1 -ArtifactDir release -ApprovedThumbprint $env:CODESIGN_APPROVED_THUMBPRINT -ApprovedMsiSha256 $env:APPROVED_MSI_SHA256 -ApprovedSqliteExeSha256 $env:SQLITE3_EXE_SHA256_APPROVED

      - name: Stage draft, attest hosted SHA256 digests, then publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
          APPROVED_MSI_SHA256: ${{ inputs.approved_msi_sha256 }}
          CODESIGN_APPROVED_THUMBPRINT: ${{ secrets.CODESIGN_APPROVED_THUMBPRINT }}
          SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED: ${{ secrets.SQLITE_TOOLS_ARCHIVE_SHA256_APPROVED }}
          SQLITE3_EXE_SHA256_APPROVED: ${{ secrets.SQLITE3_EXE_SHA256_APPROVED }}
          RELEASE_APPROVAL_MANIFEST_B64: ${{ secrets.RELEASE_APPROVAL_MANIFEST_B64 }}
          RELEASE_APPROVAL_SIGNATURE_B64: ${{ secrets.RELEASE_APPROVAL_SIGNATURE_B64 }}
          RELEASE_APPROVAL_REVIEWER_DER_B64: ${{ secrets.RELEASE_APPROVAL_REVIEWER_DER_B64 }}
          RELEASE_REVIEWER_CERT_SHA256_APPROVED: ${{ secrets.RELEASE_REVIEWER_CERT_SHA256_APPROVED }}
        run: |
          # Use authenticated GitHub API instead of git ls-remote: the prior
          # SHA-pinned checkout intentionally has persist-credentials=false.
          $refs = & gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing tag via authenticated API.' }
          $exact = @($refs | Where-Object { $_.ref -ceq "refs/tags/$env:RELEASE_TAG" })
          if ($exact.Count -gt 0) { throw 'Release tag already exists; refusing overwrite.' }
          # Recheck the SAME N56 reviewer approval, exact downloaded source
          # identity, canonical checksums, trusted publisher and embedded
          # SQLite again immediately before creating an irreversible release.
          ./Enterprise/agent/build/Assert-PublicationReviewerApproval.ps1 -ArtifactDir release -ApprovedSourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG
          ./Enterprise/agent/build/Verify-ReleaseArtifact.ps1 -ArtifactDir release -ApprovedThumbprint $env:CODESIGN_APPROVED_THUMBPRINT -ApprovedMsiSha256 $env:APPROVED_MSI_SHA256 -ApprovedSqliteExeSha256 $env:SQLITE3_EXE_SHA256_APPROVED
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Name -match '\.(msi|exe)$' -or $_.Name -eq 'SHA256SUMS.txt'
          } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 3) { throw 'Expected EXE, MSI and SHA256SUMS.txt only.' }
          # Stage assets as a NON-PUBLIC draft. gh release create otherwise
          # publishes immediately after upload, without independent checks
          # against GitHub's hosted digests. A failed attestation leaves the
          # draft hidden for security-owner review, never auto-deletes tags.
          & gh release create $env:RELEASE_TAG @assets --draft --target $env:SOURCE_SHA --title "Aaditech agent $env:RELEASE_TAG" --notes 'Trusted, timestamped Authenticode-signed agent; verify SHA256SUMS.txt and publisher before install.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub draft release staging failed; inspect drafts before retry.' }
          ./Enterprise/agent/build/Assert-RemoteReleaseAssets.ps1 -ArtifactDir release -RequireDraft
          # A release approval may expire while uploading. Recheck independent
          # original reviewer record and signed MSI contents immediately
          # before making the draft publicly accessible.
          ./Enterprise/agent/build/Assert-PublicationReviewerApproval.ps1 -ArtifactDir release -ApprovedSourceSha $env:APPROVED_SOURCE_SHA -ReleaseTag $env:RELEASE_TAG
          ./Enterprise/agent/build/Verify-ReleaseArtifact.ps1 -ArtifactDir release -ApprovedThumbprint $env:CODESIGN_APPROVED_THUMBPRINT -ApprovedMsiSha256 $env:APPROVED_MSI_SHA256 -ApprovedSqliteExeSha256 $env:SQLITE3_EXE_SHA256_APPROVED
          ./Enterprise/agent/build/Assert-RemoteReleaseAssets.ps1 -ArtifactDir release -RequireDraft
          & gh release edit $env:RELEASE_TAG --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'N59 cannot publish verified draft; manual security review required.' }
          # A successful edit response alone does not establish integrity.
          ./Enterprise/agent/build/Assert-RemoteReleaseAssets.ps1 -ArtifactDir release -RequirePublished
