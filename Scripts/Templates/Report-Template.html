<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{Title}}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; color: #222; }
        h1 { color: #1f4e79; }
        .meta { margin-bottom: 12px; color: #555; }
        .report-table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        .report-table th, .report-table td { border: 1px solid #ccc; padding: 8px; }
        .report-table th { background-color: #1f4e79; color: white; }
        .report-table tr:nth-child(even) { background-color: #f4f7fb; }
        .report-footer { margin-top: 20px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <h1>{{Title}}</h1>
    <div class="meta">Generated: {{Timestamp}}</div>
    <div id="report-body">{{ReportBody}}</div>
    <div class="report-footer">Generated by IT Toolkit Phase 1 report engine.</div>
</body>
</html>
